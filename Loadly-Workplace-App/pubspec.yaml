name:  loadly_workplace
description: Loadly Workplace App
publish_to: "none"
version: 1.1.3+8

environment:
  sdk: ^3.8.0

dependencies:
  chucker_flutter: ^1.5.1
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  device_info_plus: ^12.3.0
  dio: ^5.4.0
  dotted_border: ^3.1.0
  equatable: ^2.0.5
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  flutter_sficon: ^1.3.0
  flutter_spinkit: ^5.2.2
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  image_picker: ^1.0.7
  intl: ">=0.19.0"
  json_annotation: ^4.9.0
  local_auth: ^3.0.0
  number_pagination: ^1.1.6
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pull_to_refresh: ^2.0.0
  sentry_flutter: ^9.12.0
  shared_preferences: ^2.2.2
  slide_countdown: ^2.0.2
  url_launcher: ^6.2.0

dev_dependencies:
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  sentry_dart_plugin: ^3.2.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_native_splash:
  color: "#FFFFFF"
  # No image - native splash is minimal so only Flutter splash (with logo) is visible

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: loadly-loadly-driver
  org: fuelin-wr

flutter_launcher_icons:
  image_path: "assets/images/workplace_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0F766E"
    theme_color: "#0F766E"
  macos:
    generate: true
